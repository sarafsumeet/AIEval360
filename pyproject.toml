[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aieval360"
version = "1.0.0"
description = "Enterprise AI Evaluation and Assurance Platform"
authors = [{name = "Sumeet Saraf", email = "saraf.sumeet@gmail.com"}]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.11"
keywords = ["ai", "evaluation", "governance", "assurance", "enterprise", "responsible-ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "aiosqlite>=0.20.0",
    "pandas>=2.2.3",
    "numpy>=2.1.0",
    "scikit-learn>=1.5.2",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.17",
    "jinja2>=3.1.4",
    "rich>=13.9.0",
    "typer>=0.13.0",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
    "cryptography>=43.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    "black>=24.10.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "bandit>=1.8.0",
    "safety>=3.2.0",
    "factory-boy>=3.3.0",
]
openai = ["openai>=1.55.0"]
ollama = ["ollama>=0.4.0"]
ui = ["streamlit>=1.40.0", "plotly>=5.24.0"]

[project.scripts]
aieval360 = "aieval360.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["aieval360*"]

[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A"]
ignore = ["S101", "S603", "S607", "B008"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--tb=short -v"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "e2e: end-to-end tests that invoke scripts via subprocess (may be slow)",
    "performance: throughput and latency benchmarks (excluded from default CI run)",
]

[tool.coverage.run]
source = ["aieval360"]
omit = ["tests/*", "*/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
