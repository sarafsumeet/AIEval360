# AIEval360 — Metric Thresholds and Governance Bands
# Used by the EvaluationOrchestrator to classify results as PASS / WARN / FAIL.
# Thresholds are illustrative; calibrate against your organisation's baselines.

thresholds:
  # DETERMINISTIC METRICS
  accuracy:
    pass: 0.85
    warn: 0.70
    fail_below: 0.70

  precision:
    pass: 0.80
    warn: 0.65
    fail_below: 0.65

  recall:
    pass: 0.80
    warn: 0.65
    fail_below: 0.65

  f1:
    pass: 0.80
    warn: 0.65
    fail_below: 0.65

  bleu:
    pass: 0.60
    warn: 0.40
    fail_below: 0.40

  rouge_l:
    pass: 0.65
    warn: 0.45
    fail_below: 0.45

  exact_match:
    pass: 0.70
    warn: 0.50
    fail_below: 0.50

  character_error_rate:
    # Lower is better for CER — thresholds are inverted
    pass_below: 0.10
    warn_below: 0.20
    fail_above: 0.20

  # RAG RETRIEVAL METRICS
  context_precision:
    pass: 0.75
    warn: 0.55
    fail_below: 0.55

  context_recall:
    pass: 0.70
    warn: 0.50
    fail_below: 0.50

  retrieval_hit_rate:
    pass: 0.85
    warn: 0.70
    fail_below: 0.70

  mean_reciprocal_rank:
    pass: 0.75
    warn: 0.55
    fail_below: 0.55

  # RAG GENERATION METRICS
  answer_faithfulness:
    pass: 0.80
    warn: 0.60
    fail_below: 0.60

  answer_relevance:
    pass: 0.75
    warn: 0.55
    fail_below: 0.55

  hallucination_score:
    # Lower is better — inverse of faithfulness
    pass_below: 0.15
    warn_below: 0.30
    fail_above: 0.30

  # AGENT METRICS
  overall_agent_score:
    pass: 0.70
    warn: 0.50
    fail_below: 0.50

  goal_completion:
    pass: 0.70
    warn: 0.40
    fail_below: 0.40

  step_efficiency:
    pass: 0.65
    warn: 0.45
    fail_below: 0.45

  tool_use_accuracy:
    pass: 0.80
    warn: 0.60
    fail_below: 0.60

# SECTOR-SPECIFIC OVERRIDES
# Higher-risk use cases carry stricter thresholds.
sector_overrides:
  banking:
    accuracy:
      pass: 0.92
      warn: 0.80
      fail_below: 0.80
    hallucination_score:
      pass_below: 0.05
      warn_below: 0.10
      fail_above: 0.10

  insurance:
    accuracy:
      pass: 0.90
      warn: 0.78
      fail_below: 0.78
    answer_faithfulness:
      pass: 0.88
      warn: 0.72
      fail_below: 0.72

  university:
    answer_relevance:
      pass: 0.78
      warn: 0.60
      fail_below: 0.60
    answer_faithfulness:
      pass: 0.82
      warn: 0.65
      fail_below: 0.65
