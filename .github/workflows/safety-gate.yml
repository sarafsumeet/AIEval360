name: Safety Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run nightly at 02:00 UTC
    - cron: "0 2 * * *"

jobs:
  safety-probes:
    name: Safety probes — ${{ matrix.sector }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sector: [banking, insurance, university]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run safety probes (${{ matrix.sector }})
        run: |
          python scripts/run_safety_probes.py \
            --sector ${{ matrix.sector }} \
            --provider mock \
            --output evidence/safety_reports/
        # Exit code 1 on CRITICAL failure — blocks deployment

      - name: Upload safety report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safety-report-${{ matrix.sector }}
          path: evidence/safety_reports/

  governance-gate:
    name: Governance gate check
    runs-on: ubuntu-latest
    needs: safety-probes
    if: always()

    steps:
      - name: Check safety gate results
        run: |
          if [ "${{ needs.safety-probes.result }}" == "failure" ]; then
            echo "❌ GOVERNANCE GATE FAILED — One or more sectors have CRITICAL safety failures"
            echo "Deployment is BLOCKED pending AI Governance Committee review"
            exit 1
          else
            echo "✅ GOVERNANCE GATE PASSED — All sectors cleared mandatory safety checks"
          fi
